<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient record &middot; UHID</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/record.css">
<!-- responsive.css last: its media queries override at equal specificity -->
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="record">

<div id="app" hidden>
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">U</div>
      <div>
        <h1>UHID</h1>
        <p>Clinical Console</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="whoami">
        <div class="avatar" id="me-av">&ndash;</div>
        <div>
          <b id="me-name">&ndash;</b>
          <span id="me-role">&ndash;</span>
        </div>
      </div>
      <button class="signout" id="signout">Sign out</button>
      <button class="linkbtn" id="reset-demo-2">Reset demo data</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="gsearch">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="4.7"/><path d="M10.5 10.5L14 14"/></svg>
        <input class="field" id="gsearch" placeholder="Search UHID, phone or NID&hellip;" aria-label="Global patient search">
      </div>
      <span class="hosp" id="hosp">&ndash;</span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="../js/data.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/store.js"></script>
<script src="../js/util.js"></script>
<script src="../js/shell.js"></script>
<script src="record.js"></script>
</body>
</html>
